name: build-release

# 每次 push 到 main 自动构建 APK 并发布到 GitHub Releases（供 App 内置更新拉取）
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Decode signing keystore
        run: |
          mkdir -p keystore
          base64 -d keystore/riding.jks.b64 > keystore/riding.jks
          ls -la keystore/

      - name: Build release APK
        run: gradle assembleRelease --no-daemon
        env:
          ANDROID_HOME: $ANDROID_HOME
          ANDROID_SDK_ROOT: $ANDROID_HOME

      - name: Read version
        id: ver
        run: |
          echo "code=$(grep '^versionCode' version.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "name=$(grep '^versionName' version.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Create Release & upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: 骑行小智 v${{ steps.ver.outputs.name }}
          body: |
            自动构建版本 v${{ steps.ver.outputs.name }}（build ${{ steps.ver.outputs.code }}）

            安装包：app-release.apk（同签名，可直接覆盖安装）
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_globs: true
          generate_release_notes: false
