name: build-release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK" "platform-tools" "platforms;android-35" "build-tools;34.0.0" > /dev/null 2>&1 || true
      - name: Decode keystore
        run: |
          mkdir -p keystore
          base64 -d keystore/riding.jks.b64 > keystore/riding.jks
      - name: Decode avatars
        run: |
          for n in avatar1_closed avatar1_open avatar2_closed avatar2_open avatar3_closed avatar3_open; do
            base64 -d binary-assets/$n.jpg.b64 > app/src/main/res/drawable/$n.jpg
          done
          ls -la app/src/main/res/drawable/avatar*.jpg
      - name: Build APK
        id: build
        continue-on-error: true
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_build.log
      - name: Upload log on failure
        if: steps.build.outcome == 'failure'
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          mkdir -p logs; cp /tmp/gradle_build.log logs/build_error.log
          git add logs/build_error.log; git commit -m "diag: build error" || true
          git push origin HEAD:ci-log --force || true; exit 1
      - name: Read version
        id: ver
        run: |
          echo "code=$(grep '^versionCode' version.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "name=$(grep '^versionName' version.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: 骑行小智 v${{ steps.ver.outputs.name }}
          body: "自动构建 v${{ steps.ver.outputs.name }} build ${{ steps.ver.outputs.code }}"
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_globs: true
