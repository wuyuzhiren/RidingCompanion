apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// ---- 自动版本号迭代 ----
// 每次构建前由 build.bat 读取 version.properties 并 +1
def versionPropsFile = rootProject.file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def verCode = (versionProps.getProperty('versionCode') ?: '1').toInteger()
def verName = versionProps.getProperty('versionName') ?: '1.0.0'

android {
    namespace 'com.riding.companion'
    compileSdk 35

    defaultConfig {
        applicationId "com.riding.companion"
        minSdk 24
        targetSdk 35
        versionCode verCode
        versionName verName
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            def ks = rootProject.file('keystore/riding.jks')
            if (ks.exists()) {
                storeFile ks
                storePassword 'riding2026'
                keyAlias 'riding'
                keyPassword 'riding2026'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.fragment:fragment-ktx:1.7.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
